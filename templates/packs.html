<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CENIXJUVECARDS | PACK OPENING</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
.pack-page {
    min-height: 100vh;
    background: radial-gradient(ellipse at center,#353a44,#090a0d 65%);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 30px;
    text-align: center;
}
.pack {
    width: 220px;
    height: 320px;
    border: 2px solid #c5cbd4;
    border-radius: 18px;
    background: linear-gradient(145deg,#e5e7eb,#454b55 40%,#111318 75%,#aeb4bd);
    box-shadow: 0 25px 70px #000;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    cursor: pointer;
    transition: transform .6s, opacity .5s;
    animation: float 3s ease-in-out infinite;
}
.pack strong {
    font-size: 26px;
    letter-spacing: 3px;
}
.pack small {
    letter-spacing: 4px;
    margin-top: 15px;
}
@keyframes float {
    50% { transform: translateY(-15px) rotateY(8deg); }
}
.pack.opened {
    transform: scale(1.4) rotateY(180deg);
    opacity: 0;
}
#result {
    margin-top: 35px;
}
.result-card {
    width: 240px;
    padding: 15px;
    margin: auto;
    border: 2px solid var(--rarity);
    border-radius: 14px;
    background: linear-gradient(145deg,#353a44,#111318);
    box-shadow: 0 0 35px color-mix(in srgb,var(--rarity),transparent 45%);
    animation: reveal .8s ease both;
}
.result-card img {
    width: 100%;
    height: 260px;
    object-fit: cover;
    object-position: top;
    filter: grayscale(100%);
}
.result-card h2 { font-size: 20px; }
@keyframes reveal {
    from { opacity: 0; transform: scale(.5) rotateY(90deg); }
    to { opacity: 1; transform: scale(1) rotateY(0); }
}
button {
    background: #e1e3e8;
    border: none;
    padding: 14px 24px;
    margin-top: 25px;
    cursor: pointer;
    font-weight: bold;
    letter-spacing: 2px;
}
</style>
</head>
<body>
<main class="pack-page">
    <p style="letter-spacing:5px;color:#c2c6ce">CENIXJUVECARDS</p>
    <h1>ULTIMATE PACK</h1>
    <p>SCOPRI LA TUA PROSSIMA LEGGENDA</p>

    <div class="pack" id="pack" onclick="openPack()">
        <strong>CENIX</strong>
        <strong>JUVE</strong>
        <small>PREMIUM PACK</small>
        <p>✦ LIMITED EDITION ✦</p>
    </div>

    <div id="result"></div>

    <button onclick="openPack()">APRI BUSTINA</button>
    <a href="/" style="color:white;margin-top:30px">← TORNA ALL'ALBUM</a>
</main>

<script>
async function openPack() {
    const pack = document.getElementById('pack');
    const result = document.getElementById('result');

    if (pack.dataset.opening === "true") return;
    pack.dataset.opening = "true";
    result.innerHTML = "";

    pack.classList.remove('opened');
    void pack.offsetWidth;
    pack.classList.add('opened');

    try {
        const response = await fetch('/api/open-pack');
        if (!response.ok) throw new Error("Errore apertura");

        const card = await response.json();

        setTimeout(() => {
            result.innerHTML = `
                <div class="result-card" style="--rarity:${card.color}">
                    <p style="color:${card.color};letter-spacing:3px">${card.rarity}</p>
                    <img src="/static/images/legends/${card.slug}.jpg"
                         onerror="this.style.display='none'">
                    <h2>${card.name}</h2>
                    <p>RATING ${card.rating} · #${card.number}</p>
                </div>
                <p style="color:#c2c6ce">NUOVA CARTA SCOPERTA</p>
            `;
            pack.classList.remove('opened');
            pack.dataset.opening = "false";
        }, 600);
    } catch (error) {
        result.innerHTML = "<p>Impossibile aprire la bustina. Riprova.</p>";
        pack.classList.remove('opened');
        pack.dataset.opening = "false";
    }
}
</script>
</body>
</html>
